services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379" # Redis port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  memgraph:
    image: memgraph/memgraph:latest
    ports:
      - "7688:7687" # Bolt port 
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  arangodb:
    image: arangodb:latest
    environment:
      - ARANGO_ROOT_PASSWORD=testpassword
    ports:
      - "8529:8529" # HTTP port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  surrealdb:
    image: surrealdb/surrealdb:latest
    ports:
      - "8001:8000"
    command: start --user root --pass testpassword memory
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
