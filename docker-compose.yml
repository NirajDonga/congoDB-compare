services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379" # Redis port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  memgraph:
    image: memgraph/memgraph:latest
    ports:
      - "7688:7687" # Bolt port 
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  arangodb:
    image: arangodb:latest
    environment:
      - ARANGO_ROOT_PASSWORD=testpassword
    ports:
      - "8529:8529" # HTTP port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  age:
    image: apache/age:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
